<text x="16.0" y="170.8" font-size="14" font-weight="400" fill="#1b1916" text-anchor="start" letter-spacing="0" style="">independent reviewer&#x27;s scores (0, 1 or 2</text>
<text x="16.0" y="189.7" font-size="14" font-weight="400" fill="#1b1916" text-anchor="start" letter-spacing="0" style="">per axis; never added up).</text>
