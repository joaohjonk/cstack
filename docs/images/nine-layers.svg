<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 728" width="1200" height="728" role="img" aria-labelledby="t d">
<title id="t">The nine layers of cstack</title><desc id="d">Drawn as a single transit line with nine stations, from Reality to Compounding taste. A branch runs from Memory back up to Canon: every decision feeds back.</desc>
<rect width="1200" height="728" fill="#F6F4EF"/>
<text x="96" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-1" fill="#151515">One line, nine stops</text>
<text x="96" y="118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8C8A85">From the world inward, and back out. Every decision feeds back.</text>
<path d="M300 562 L230 492 L230 352 L300 282" fill="none" stroke="#D7261E" stroke-width="8" stroke-linejoin="round" opacity="0.35"/>
<line x1="300" y1="170" x2="300" y2="618" stroke="#D7261E" stroke-width="8"/>
<circle cx="300" cy="170" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="175" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">01</text>
<text x="336" y="177" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Reality</text>
<text x="560" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">What is true about the product and the company</text>
<circle cx="300" cy="226" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="231" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">02</text>
<text x="336" y="233" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Culture</text>
<text x="560" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">People, scenes, rituals, language</text>
<circle cx="300" cy="282" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="287" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">03</text>
<text x="336" y="289" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Canon</text>
<text x="560" y="288" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">Mental models from people who did it well</text>
<circle cx="300" cy="338" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="343" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">04</text>
<text x="336" y="345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">References</text>
<text x="560" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">Near, middle and far: source, mechanism, transfer</text>
<circle cx="300" cy="394" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="399" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">05</text>
<text x="336" y="401" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">System</text>
<text x="560" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">Tokens, type, grids, components, motion, voice</text>
<circle cx="300" cy="450" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="455" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">06</text>
<text x="336" y="457" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Generation</text>
<text x="560" y="456" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">People, agents, Figma, code, models</text>
<circle cx="300" cy="506" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="511" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">07</text>
<text x="336" y="513" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Judgment</text>
<text x="560" y="512" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">Gold, anti, pairwise picks, independent review</text>
<circle cx="300" cy="562" r="10" fill="#F6F4EF" stroke="#151515" stroke-width="3"/>
<text x="96" y="567" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">08</text>
<text x="336" y="569" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Memory</text>
<text x="560" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">Every correction is written down</text>
<circle cx="300" cy="618" r="13" fill="#D7261E" stroke="#D7261E" stroke-width="3"/>
<text x="96" y="623" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8C8A85">09</text>
<text x="336" y="625" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#151515">Compounding taste</text>
<text x="560" y="624" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C8A85">The next brief starts smarter than the last</text>
<text x="212" y="422" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#D7261E" transform="rotate(-90 212 422)">feeds back</text>
</svg>
