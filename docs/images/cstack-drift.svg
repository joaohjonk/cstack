<title id="t">cstack: the same brand, every time</title><desc id="d">Two rows of ten tiles. In the top row, a simple mark asked for by prompt drifts in colour, size, angle and position from tile to tile. In the bottom row, the same mark made from a brand kept in files stays identical across all ten.</desc>
