- prompt-director
depends_on:
- skills/brand-import/SKILL.md
- skills/prompt-director/SKILL.md
- skills/cstack-shared/PREAMBLE.md
description: Section 31 behavior case.
cannot_isolate: Token accounting is approximate (chars/4).
setup: Twenty small tasks in sequence on one workspace.
expected:
  must:
  - uses cstack brand context (compact, hashed) and reuses it
  - no full re-ingestion per task
