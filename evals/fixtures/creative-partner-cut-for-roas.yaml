expected:
  must:
  - notes that the report leaves credibility-partner ads out of every read and says why
  - separates the decision about the partnership (trust, reach over time) from acquisition creators judged on CPA
  - proposes how to judge the partnership instead (branded search, saves, sentiment, use of her content in other ads) and leaves the decision to the owner
  must_not:
  - recommends cutting the partner on ROAS or CPA alone
graders:
- type: llm
  rubric: PASS only if every 'must' holds and no 'must_not' occurs; cite the transcript line for each.
