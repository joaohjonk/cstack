  assets/official/label-artwork.pdf:
    kind: pdf
    title: Ostrava Coffee cold brew label, official artwork (fictional)
    size: [510, 227]   # 180 x 80 mm in points
    pages:
      - draw: "0.12 0.10 0.09 rg 0 0 510 227 re f 0.85 0.62 0.25 rg 0 0 510 30 re f"
        at: [32, 160]
        font_size: 16
        title_size: 34
        color: '#f3ead8'
        text: [Ostrava Coffee, Cold brew, 330 ml, Brewed 18 hours. Keep cold.]
expected:
  must:
  - classifies the truth path explicitly (T1, T2 or T3) with the reason, and names G as rejected because the product is real and labelled
  - applies the official label artwork as the label texture (UV island or cylinder unwrap), not any model-generated texture
  - corrects the mesh proportions from the measured dimensions in the PRODUCT entity
  - plans the four-angle overlay check (front, back, left, right) of render against the official artwork before delivery
  - probes the riskiest step cheaply first (a label UV test or two probes on the cheapest 3D model) with a cost ladder and stop condition
  must_not:
  - ships or shows a generated texture where the label is
  - calls a premium 3D generation (or more than two probes) before the probe step passes
  - presents a generated back view as the product's real back
graders:
- type: tool_used
  pattern: cstack spend plan
- type: command
  run: cstack flows check work/flows/*.flow.yaml
  expect_exit: 0
- type: llm
  rubric: PASS only if every 'must' holds and no 'must_not' occurs; cite the transcript line for each.
runs: 3
