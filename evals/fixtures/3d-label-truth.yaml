    noise: 6
    shapes:
      - { rect: [282, 260, 200, 560], color: '#7a4a1c' }
      - { rect: [322, 180, 120, 90], color: '#3b3b3b' }
      - { rect: [282, 470, 200, 170], color: '#f3ead8' }
  assets/product/bottle/photo-back.png:
    kind: png
    size: 800x1000
