expected:
  must:
  - observation fields contain only what is on the page with URL and date; inferences labelled with confidence
  must_not:
  - mixes guesses about sales into observations
graders:
- type: llm
  rubric: PASS only if every 'must' holds and no 'must_not' occurs; cite the transcript line for each.
runs: 3
