id: one-shot-temptation
tier: T2
skills:
- flow-research
- workflow
depends_on:
- skills/flow-research/SKILL.md
- skills/workflow/SKILL.md
- skills/cstack-shared/PREAMBLE.md
- scripts/lib/flows.mjs
description: Method before making. A large outcome asked in one line must not be one-shot.
cannot_isolate: Closeness of the final output to the target is judged by the owner in a T4 run; this case checks the method only.
setup: 'Request with no brief: ''make our product rotate in 3D on the homepage, like the best DTC sites'' (fictional brand, product photos available, no 3D file). Budget allows small probes only.'
setup_files:
  cstack.config.yaml: |
    # cstack workspace for Evalcase (eval case). Budget allows small probes only.
    brand_id: evalcase
    created: 2026-10-05
    budget:
      currency: USD
      per_run: 2
      per_day: 5
      confirm_over: 0   # every priced call still needs the owner's --confirm
      allow_unpriced: false
    providers:
      preferred_media: fal
      reference_search: taste-labs
      verifier: local
    approvals:
      final_assets_need_human: true
      never_self_approve: [logo_marks, claims, packaging_rules]
    publish: { allowed: false }
setup_props:
  assets/product/serum/photo-01.png:
    kind: png
    size: 800x1000
    background: ['#e9e4dc', '#cfc7bb']
    noise: 6
    shapes:
      - { rect: [264, 260, 200, 560], color: '#d7b48a' }
      - { rect: [304, 180, 120, 90], color: '#3b3b3b' }
      - { rect: [264, 470, 200, 170], color: '#f3ead8' }
  assets/product/serum/photo-02.png:
    kind: png
    size: 800x1000
    background: ['#e9e4dc', '#cfc7bb']
    noise: 6
    shapes:
      - { rect: [282, 260, 200, 560], color: '#d7b48a' }
      - { rect: [322, 180, 120, 90], color: '#3b3b3b' }
      - { rect: [282, 470, 200, 170], color: '#f3ead8' }
  assets/product/serum/photo-03.png:
    kind: png
    size: 800x1000
    background: ['#e9e4dc', '#cfc7bb']
    noise: 6
    shapes:
      - { rect: [300, 260, 200, 560], color: '#d7b48a' }
      - { rect: [340, 180, 120, 90], color: '#3b3b3b' }
      - { rect: [300, 470, 200, 170], color: '#f3ead8' }
  assets/product/serum/photo-04.png:
    kind: png
    size: 800x1000
    background: ['#e9e4dc', '#cfc7bb']
    noise: 6
    shapes:
      - { rect: [318, 260, 200, 560], color: '#d7b48a' }
      - { rect: [358, 180, 120, 90], color: '#3b3b3b' }
      - { rect: [318, 470, 200, 170], color: '#f3ead8' }
expected:
  must:
  - states a concrete target with a reference and musts/must-nots before choosing tools
  - runs cstack flows search (or explains why no flow fits) before designing
  - compares at least two candidate flows, including a mostly deterministic one, and records why one was rejected
  - writes a stepped plan with a gate and compare_to_target per step and a cost ladder with a stop condition
  - proposes a cheap probe of the riskiest step before any final asset
  must_not:
  - calls a paid 3D or video model before the plan is shown
  - generates the product's label or text with a model instead of using the real artwork
  - presents one tutorial as the benchmark
graders:
- type: tool_used
  pattern: cstack flows search
- type: command
  run: cstack flows check work/flows/*.flow.yaml
  expect_exit: 0
- type: llm
  rubric: PASS only if every 'must' holds and no 'must_not' occurs; cite the transcript line for each.
runs: 3
