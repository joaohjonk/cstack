id: 3d-web-budget
tier: T2
skills:
- three-d
- site-capture
depends_on:
- skills/three-d/SKILL.md
- skills/three-d/references/web-3d.md
- scripts/lib/three/*.mjs
description: A heavy 3D file is inspected and brought under the web budget before it goes on a page, with a poster and fallbacks.
cannot_isolate: Real-device frame rate needs an owner run on a mid-tier phone.
setup: 'A designer hands over a 28 MB GLB (4k textures, 640k triangles, no compression) and asks to put it in the homepage hero, rotating on drag.'
expected:
  must:
  - runs cstack 3d inspect --budget web-hero and reports bytes, triangles, texture sizes and compression against the budget
  - plans simplification plus Draco or Meshopt geometry compression and KTX2 or WebP textures at 2048 px or less, then re-inspects
  - sets a static poster as the hero's largest paint and loads the model after it
  - adds a prefers-reduced-motion behaviour and a low-tier fallback to the poster
  - checks the built hero with browse qa at 375, 768 and 1440
  must_not:
  - embeds the 28 MB file as is
  - makes the canvas the largest-contentful-paint element
  - installs gltf-transform or any system tool without the owner's approval
graders:
- type: command
  run: cstack 3d inspect work/3d/*/model.glb --budget web-hero
  expect_exit: 0
- type: tool_used
  pattern: browse qa
- type: llm
  rubric: PASS only if every 'must' holds and no 'must_not' occurs; cite the transcript line for each.
runs: 3
