id: 3d-fake-vs-real
tier: T2
skills:
- three-d
- flow-research
depends_on:
- flows/3d-web-hero.flow.yaml
- skills/three-d/SKILL.md
- skills/three-d/references/web-3d.md
- skills/flow-research/SKILL.md
- docs/research/3d.md
description: Fixed choreography goes to an image sequence or video scrub; real-time 3D is chosen only when interaction or reuse pays for it.
cannot_isolate: Perceived smoothness on the page is checked by the owner in a T4 run.
setup: 'Request: ''a scroll animation of the product opening, like premium homepages; no interaction needed''. Fictional brand; a dieline, the official artwork and a shape-only GLB of the tin (work/3d/tin/model.glb) exist. No Blender here.'
setup_props:
  assets/official/tin-wrap-artwork.svg:
    kind: svg
    text: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
      <title>Halden Tea Co. tin wrap, official artwork (fictional)</title>
      <rect width="600" height="240" fill="#1f3a34"/>
      <rect x="0" y="196" width="600" height="44" fill="#c9a24a"/>
      <text x="40" y="96" font-family="Georgia, serif" font-size="44" fill="#f3ead8">Halden Tea Co.</text>
      <text x="40" y="140" font-family="Georgia, serif" font-size="22" fill="#f3ead8">Smoked Lapsang, 100 g loose leaf</text>
      <text x="40" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3a34">Batch 26-09  Packed in Halden</text>
      </svg>
  assets/official/tin-dieline.svg:
    kind: svg
    text: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640mm" height="420mm">
      <title>Tin wrap and lid dieline, 1 unit = 1 mm (fictional)</title>
      <rect x="20" y="20" width="600" height="240" fill="none" stroke="#e4007c" stroke-width="1"/>
      <line x1="20" y1="30" x2="620" y2="30" stroke="#00a0e9" stroke-dasharray="6 4"/>
      <line x1="20" y1="250" x2="620" y2="250" stroke="#00a0e9" stroke-dasharray="6 4"/>
      <circle cx="120" cy="340" r="62" fill="none" stroke="#e4007c"/>
      <text x="200" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12">wrap 600 x 240 mm (circumference 600 = diameter 191 mm); lid disc 124 mm; bleed 3 mm; magenta = cut, cyan = fold</text>
      </svg>
  work/3d/tin/model.glb:   # shape-only tin built from the dieline (191 mm x 240 mm); no label UVs, the label is still to be mapped
    kind: glb
    size: [0.191, 0.24, 0.191]
    triangles: 4000
    textures:
      - { width: 2048, height: 1024 }
    node_name: halden-tin
expected:
  must:
  - compares an image sequence (or video scrub) against a real-time GLB and gives the reason for the choice (fixed choreography, render quality, label safety)
  - renders frames from the truth asset rather than generating them, or explains why generated frames are safe here
  - sets a frame budget (150 frames or fewer) and a byte budget (about 8 MB or less) and checks it with cstack 3d frames
  - specifies poster first, preload strategy, reduced-motion behaviour and no scroll trapping
  must_not:
  - chooses real-time 3D without naming what interaction or reuse justifies it
  - uses image-to-video for the label-critical opening without a frame-sampled label check
graders:
- type: tool_used
  pattern: "3d (frames|blender-script)(?![^\\n]*--help)[^\\n]*(work/|\\.glb|/frames)"
- type: regex
  pattern: (3d frames[^\n]*\b(PASS|within)|blender-script[^\n]*--frames)
- type: llm
  rubric: PASS only if every 'must' holds and no 'must_not' occurs; cite the transcript line for each.
runs: 3
