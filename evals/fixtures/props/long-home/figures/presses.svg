<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t">
  <title id="t">Presses and queues</title>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="110" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#2b2a28">Presses and queues</text>
  <text x="60" y="160" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6b665e">Arrows show the order a job moves in.</text>
  <rect x="60" y="260" width="230" height="180" rx="12" fill="#f4efe6" stroke="#2b2a28" stroke-width="3"/>
  <text x="80" y="360" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b2a28">Offset A</text>
  <rect x="330" y="260" width="230" height="180" rx="12" fill="#f4efe6" stroke="#2b2a28" stroke-width="3"/>
  <text x="350" y="360" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b2a28">Offset B</text>
  <rect x="600" y="260" width="230" height="180" rx="12" fill="#f4efe6" stroke="#2b2a28" stroke-width="3"/>
  <text x="620" y="360" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b2a28">Digital</text>
  <rect x="870" y="260" width="230" height="180" rx="12" fill="#f4efe6" stroke="#2b2a28" stroke-width="3"/>
  <text x="890" y="360" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2b2a28">Riso</text>
  <text x="60" y="560" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b665e">Arrows show the order a job moves in; dashed boxes are optional steps.</text>
</svg>
