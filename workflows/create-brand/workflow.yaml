name: create-brand
status: template
summary: 'Build a new brand from zero, founder first but not founder only: interview the founder, customer and category, strategy with a challenge, culture, references the founder reacts to, territories plus one cstack argues for, craft, then downstream: packs, a photoshoot, ads and a launch page, and a replicability trial.'
entry_skill: workflow
methods:
- mood-probes
- concept-wrap
- grid-pick-polish
- paid-social-cutdowns
- logo-system
- type-system
- icon-set
triggers:
- create a brand
- new brand
- brand from zero
- naming and identity
note: template = not yet proven on a real run. Promote to validated only with a linked run record in runs.
runs: []
steps:
- id: founder-interview
  skill: brief
  does: 'founding mode: interview the founder as a studio takes a brief (why the brand exists, the founder''s story and conviction,
    the customer, the brand as a person, assets and inspirations in hand) before any research, reference or territory'
  outputs:
  - briefs/*.founder-brief.yaml
  gate: owner
- id: brief
  skill: brief
  does: the identity brief, written from the approved founder brief
  outputs:
  - briefs/*.creative-brief.yaml
  gate: owner
- id: customer-and-category
  skill: competitor-intel
  does: 'customer first: who they are, where they meet the category (real shelves, feeds, counters), then the category map'
  outputs:
  - work/competitors/*-category-map.md
  gate: auto
  fallback: browse public category pages; label as heuristic
- id: strategy-positioning
  does: 'strategy, positioning, beliefs, tensions and value proposition written into brand-system with approval: testing (brief
    + creative-direction lenses)'
  outputs:
  - brand/brand-system.json
  gate: owner
- id: challenge-strategy
  skill: creative-review
  does: 'founder first, not founder only (F87): a challenge memo against the positioning before anything is made: the safe choice, the braver version, and one question each on price, claim and positioning (creative-review references/challenge.md); the founder answers in their words'
  outputs:
  - work/direction/*-challenge.md
  - state/feedback.jsonl
  gate: owner
- id: culture
  skill: cultural-scan
  outputs:
  - work/culture/*.md
  gate: auto
- id: references
  skill: taste-search
  does: 'the founder''s own inspirations first, then research (owner exports from tools like Cosmos, the web, real shelves);
    a board brought back to the founder ("a bit of this, a bit of that": cstack sheet board, keep or kill per card),
    their reactions recorded as feedback. The founder drops their own pictures into references/inspiration/ in the
    workspace on their computer; say that path to them, since an agent on another machine cannot see their files'
  outputs:
  - references/
  - work/references/*-packet.md
  - work/sheets/*.html
  - state/feedback.jsonl
  gate: owner
  fallback: local canon + public web
- id: territories
  skill: creative-direction
  does: identity, verbal and art-direction territories from the founder brief and the reactions, made visible with the mood-probes
    flow (its make gate needs both)
  outputs:
  - work/direction/*-territories.md
  - work/sheets/
  gate: auto
- id: challenge-territories
  skill: creative-strategist
  does: 'cstack argues for one territory the founder did not ask for, made visible beside theirs with the same probes and budget, and says what it would risk; it competes on the blind sheet, never replaces the founder''s'
  outputs:
  - work/direction/*-challenge.md
  - work/sheets/
  gate: auto
- id: selection
  does: the founder picks pairs on a blind sheet (cstack sheet), then chooses one territory, or a merge critiqued again
  outputs:
  - state/feedback.jsonl
  gate: owner
- id: systemization
  skill: identity-system
  does: 'craft: name, mark, type and colour from the chosen territory, held to the proven rules (grid, hierarchy, legibility)
    and looped with the founder until they believe it is right; the result is the base of consistency'
  outputs:
  - brand/tokens/
  - brand/rules/brand-rules.yaml
  gate: owner
- id: voice
  skill: copywriting
  does: voice system, vocabulary, banned language, naming lines
  outputs:
  - work/copy/*.md
  gate: auto
- id: brand-world
  does: 'the identity extended into its world: products, packaging, photography, light, materials, surfaces, cast, in brand-world.json'
  outputs:
  - brand/brand-world.json
  gate: auto
- id: packaging
  skill: identity-system
  does: 'downstream starts at the pack (F88): an approved pack spec from the dieline or print file, then flat wraps with the brand line and every on-pack element in real type (flow concept-wrap), on a template or true 3D pack, measured with cstack pack check; multipacks and a retail display when the brand sells in stores'
  outputs:
  - work/pack/
  gate: owner
- id: photoshoot
  skill: campaign-sequence
  does: 'a photoshoot on the real packs: shot roles, Shot DNA per frame, product truth from the pack spec and owner photos (workflow product-photoshoot); generated plates only around the real pack, labelled illustrative when the pack is redrawn'
  outputs:
  - work/shoot/
  gate: owner
- id: ads
  skill: asset-factory
  does: 'a launch ad family from the photoshoot and the line: static ads at the channels'' sizes, one UGC storyboard and a cutdown plan (workflow growth-creative, flow paid-social-cutdowns), each with a bet and a cell'
  outputs:
  - work/ads/
  gate: owner
- id: launch-page
  skill: workflow
  does: 'a launch page from the same system (workflow landing-page), checked at desktop and phone width'
  outputs:
  - work/site/
  gate: owner
- id: replicability
  skill: workflow
  does: 'prove the system carries the brand without its makers: a brand trial (workflow brand-trial, cstack trial) where agent teams with only the brand files answer simulated problems, attributed blind against a control team'
  outputs:
  - work/trials/
  gate: owner
- id: verification
  skill: brand-verify
  outputs:
  - state/evals.jsonl
  gate: auto
- id: review
  skill: creative-review
  outputs:
  - work/reviews/*.md
  gate: owner
- id: brand-state
  does: promote approved fields to current; brandbook page generated from brand-system + tokens
  outputs:
  - brand/brand-system.json
  - work/system/brandbook.html
  gate: auto
- id: retro
  skill: learn-loop
  outputs:
  - work/retro/*.md
  gate: auto
