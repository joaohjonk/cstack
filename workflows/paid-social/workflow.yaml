name: paid-social
status: template
summary: A controlled paid-social round that learns from performance without erasing brand distinctiveness.
entry_skill: workflow
methods:
- paid-social-cutdowns
triggers:
- paid social
- ads
- meta ads
- tiktok ads
- creative testing
note: template = not yet proven on a real run. Promote to validated only with a linked run record in runs.
runs: []
steps:
- id: performance-ingest
  does: import results into state/performance.jsonl (creative-performance schema); no causal claims from weak data
  gate: auto
  fallback: 'no data yet: start from hypotheses'
- id: competitor-trends
  skill: competitor-intel
  gate: auto
- id: creative-decomposition
  does: decompose past ads into features (hook, first frame, product timing, face, proof, pacing, CTA ...)
  gate: auto
- id: hypotheses
  skill: brief
  does: 2-4 testable hypotheses; each changes one feature
  gate: owner
- id: variants
  skill: generate-media
  does: controlled variants via prompt-director recipes; one variable per variant
  gate: auto
- id: video-variants
  skill: video-direction
  does: 'when the round includes video: hook variants from one master (hooks x scripts with a stop condition), cut-downs derived in video-assembly, never regenerated'
  gate: owner
  fallback: 'skip with reason for a static-only round'
- id: copy
  skill: copywriting
  gate: auto
- id: claims
  skill: claims-proof
  gate: auto
- id: brand-verify
  skill: brand-verify
  gate: auto
- id: export
  does: export with experiment ids in names and sidecars
  outputs:
  - work/exports/
  gate: auto
- id: learn
  skill: learn-loop
  does: 'after results: what repeated, what is confounded, what deserves another test'
  gate: auto
