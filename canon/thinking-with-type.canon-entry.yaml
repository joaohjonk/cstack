id: thinking-with-type
name: Thinking with Type (Ellen Lupton)
kind: book
domains:
- typography
- pedagogy
- editorial
- web
mental_model: 'typography as letter, text and grid: three scales of decision that must agree, taught as rules with reasons so they can be broken on purpose'
mechanisms:
- 'decide at three scales and check that they agree: the letter (face, family, figures, small caps), the text (spacing, alignment, emphasis, hierarchy) and the grid (columns, modules, sequence)'
- state each rule with the reason it exists and the case that breaks it; break it only on purpose and record why
- set type through named, reusable styles (paragraph and character styles in print, classes and tokens on screen), never by formatting one instance by hand
- use the family's own resources before adding a family (true small caps, lining or oldstyle figures, real italics, weights) and never fake them
- build hierarchy from a few clear contrasts, changing one or two properties per level
- treat variable fonts, optical sizes, other writing systems and accessibility as baseline requirements, not extras
representative_works:
- Thinking with Type (Princeton Architectural Press, 2004; revised and expanded 2nd ed. 2010; 3rd ed. 2024)
- thinkingwithtype.com (companion site)
when_useful:
- teaching an agent or a new team the vocabulary and the order of type decisions
- writing type tokens, style rules and hierarchy reviews
- critiquing a layout where letter, paragraph and grid decisions disagree
when_not_useful:
- 'as a source of exact numbers: it is a critical guide, so take numeric defaults from tests, platforms and standards (canon:practical-typography, canon:web-typography)'
- expressive display work that breaks reading conventions on purpose, unless the break is named and bounded
tensions:
- readability defaults vs. brand voice
- 'rules taught so they can be broken vs. agents that need enforceable rules: keep the rule, its reason and the recorded exception together'
- 'editions differ: the 2nd edition (2010) predates variable fonts on the web; cite the 3rd edition (2024) for variable fonts, optical sizes, writing systems and accessibility'
- 'Western, print-rooted examples vs. screens and global scripts: pair it with canon:web-typography for screen behaviour'
distance_from:
  editorial: near
  web-product-ui: middle
  identity: middle
  packaging: middle
