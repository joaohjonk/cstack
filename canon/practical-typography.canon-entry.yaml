id: practical-typography
name: Practical Typography (Matthew Butterick)
kind: book
domains:
- typography
- documents
- web
mental_model: 'body text first: four decisions (point size, line spacing, line length, font) decide most of the reading experience, so fix them with numeric ranges before anything decorative'
mechanisms:
- fix the four body-text decisions first (point size, line spacing, line length, font) and only then style anything else
- 'start from ranges: 10 to 12 pt in print or 15 to 25 px on the web, line spacing at 120 to 145 percent of the size, and an average line of 45 to 90 characters including spaces'
- measure line length as average characters per line (about two to three alphabets), not in inches or pixels
- 'treat mixing fonts as optional: one font varied by size, weight and style often suffices, a second is usually tolerable, a third rarely; give each font a consistent role and mix only faces that are clearly different'
- 'keep emphasis rare and single: one device at a time, underline reserved for links, all caps only for short runs'
- letterspace capitals and small caps by 5 to 12 percent (letter-spacing 0.05em to 0.12em) and leave lowercase alone
- 'mark paragraphs one way, an indent of one to four times the size or 4 to 10 pt of space, not both; justified text needs hyphenation to keep word spaces even'
representative_works:
- Butterick's Practical Typography (practicaltypography.com, online book, revised over time)
- Typography for Lawyers (book and site)
- The copyrightability of fonts revisited (essay, 21 December 2025)
when_useful:
- documents, reports, long web text, legal and policy pages
- deterministic defaults an agent can check with a tool (cstack type qa)
- teaching non-designers to improve body text quickly
when_not_useful:
- brand display typography and expressive layouts
- 'its advice to avoid most free fonts and system fonts: sound for documents that default to Times New Roman or Arial, too broad for product UI, where platform system fonts are engineered for the screen'
- interface text where platform text styles and user text-size settings govern sizes
tensions:
- 'wider ranges than canon:bringhurst (45 to 90 vs. 45 to 75 characters) for the same goal'
- 'anti-system-font and anti-free-font stance vs. platform practice and the open-licence majority of web fonts (canon:web-typography)'
- 'copyright vs. licence: his 2025 essay argues US copyright protects fonts far less than the industry assumes, so licences and contracts carry the real weight'
distance_from:
  editorial: near
  web-product-ui: middle
  packaging: middle
  identity: far
  campaign-advertising: far
  motion: far
  wayfinding: far
