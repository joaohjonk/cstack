id: swiss-grid-systems
name: Swiss / International Typographic Style and grid systems (Müller-Brockmann)
kind: framework
domains:
- typography
- layout
- editorial
- systems
mental_model: 'the grid as a commitment to clarity and order: a measured field derived from the type, which keeps many layouts consistent while the content changes'
mechanisms:
- derive the grid from the type, basing the module on the body text line (size plus leading) so text and grid share one measure
- pick the number of fields from the density of the content (the method covers 8 to 32 fields, and three-dimensional grids) and treat spans of fields as the only legal sizes for text and images
- carry hierarchy with size, weight and position instead of ornament, with text set flush left and ragged right
- use asymmetric balance and active white space as structure, not as leftover space
- separate the information from the designer's taste so other people can continue the system
- 'treat the grid as an aid, not a guarantee: it narrows the choices, and quality still comes from judgment and practice'
representative_works:
- Josef Müller-Brockmann, Grid Systems in Graphic Design / Rastersysteme für die visuelle Gestaltung (Niggli, 1981; 10th revised ed. 2016)
- 'Müller-Brockmann, "Grid and Design Philosophy" (excerpt reprinted in Texts on Type, 2001)'
- Neue Haas Grotesk (1957), renamed Helvetica in 1960
when_useful:
- landing pages, decks, reports, packaging back panels and any dense information
- templates that many people or agents fill, where the grid turns layout into legal spans
- responsive systems, with column counts per breakpoint and spacing in multiples of the line height
when_not_useful:
- 'as a historical costume (Helvetica, flush left, red and black): operationalize the principles, not the posters'
- 'expressive, collage or vernacular identities where breaking order is the message (canon:pentagram)'
- strict baseline grids on the web, where fonts, zoom and user spacing overrides move baselines; use consistent spacing tokens instead
tensions:
- 'fixed modules vs. fluid viewports, browser zoom and user text-spacing overrides (canon:web-typography)'
- 'objective typography carried a cultural position (postwar Swiss modernism, corporate internationalism) that later designers rebelled against (canon:pentagram)'
- 'one fixed grid vs. a grid built as a programme that serves several column counts (canon:gerstner-designing-programmes)'
- 'a correct grid does not make a good page; canon:vignelli shares the discipline and still judges meaning and use separately'
distance_from:
  editorial: near
  web-product-ui: near
  wayfinding: near
  identity: middle
  packaging: middle
  campaign-advertising: middle
  motion: far
