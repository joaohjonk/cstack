transferable_mechanism: >-
  Variation within one species is made legible by holding everything else constant: same scale, same
  angle, same light, same spacing, each individual numbered. Difference becomes the subject instead of a
  defect.
mechanism_tags: [variation_as_subject, controlled_comparison, catalogue, numbering]
transfer: >-
  A batch grid: every plate from one kiln load shot top-down at identical scale, angle and light on the
  ash-white ground, numbered by kiln shelf position. It shows piece-to-piece glaze variation honestly
  (product_representation.glaze_truth) and makes "sold by the batch" visible.
incidental_content: [hand-coloured engraving, Latin labels, birds and shells]
