# Experiment spec (fictional example). Generated by `cstack experiment init`, then edited.
run_id: exp-hero-plate-traces
fixture: recipes/autumn-hero-plate.prompt-recipe.yaml (all slots but traces frozen)
baseline_version: autumn-hero-plate@1
mutable_surface: prompt.slot.traces
frozen:
  - fixture
  - evaluator
  - model
  - reference_set
  - crop
  - other prompt slots
primary_metric:
  name: pairwise preference vs incumbent
  method: pairwise_vs_incumbent
  higher_is_better: true
guardrails:
  - name: product_truth
    rule: no ceramic object is generated in the empty composite area (the real plate
      is composited later)
  - name: brand_fit
    rule: passes both anti references (R-IMG-03) and no regression vs incumbent
regression_fixtures: []
time_budget_minutes: 30
spend_budget:
  amount: 0.5
  currency: USD
max_experiments: 6
seeds_per_candidate: 2
stop_conditions:
  - spend_budget reached
  - max_experiments reached
  - 4 consecutive discards (gains flattened)
  - evaluator uncertainty larger than apparent gain
evaluator: creative-review (separate from the author) + owner pairwise for finalists
program: experiments/runs/exp-hero-plate-traces/program.md
notes: "ILLUSTRATIVE example run: provider is the mock, so rows show the ledger
  shape, not real image judgments."
