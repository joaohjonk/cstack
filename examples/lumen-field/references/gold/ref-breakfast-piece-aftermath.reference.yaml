transfer: >-
  Hero table shots for Lumen Field show the table a few minutes after the meal: a torn heel of bread, a
  smear of sauce in the plate well, a spoon resting on a bowl rim. One or two traces, never a mess. This is
  the mechanism behind photography.approach ("after people have eaten, not before").
