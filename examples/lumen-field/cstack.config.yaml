# cstack workspace for Lumen Field (FICTIONAL example shipped inside cstack; a real brand workspace lives in its own repo).
brand_id: lumen-field
created: 2026-10-03

# Spend envelope. Paid provider calls are BLOCKED until these are set.
# Keep them small while you learn what a run costs; raise them on purpose.
budget:            # left at 0 on purpose: the example demonstrates that paid calls are blocked
  currency: USD
  per_run: 0        # max estimated spend for one batch
  per_day: 0        # max spend per calendar day across all runs
  confirm_over: 0   # calls estimated above this need the owner's --confirm

# Providers: keys come from environment variables only (FAL_KEY, TASTE_API_KEY, ...). Never write keys here.
providers:
  preferred_media: mock         # example workspace: mock only, never a paid provider
  reference_search: taste-labs  # falls back to manual reference curation when TASTE_API_KEY is absent
  verifier: local               # local | taste-labs (needs a public candidate URL)

# Owner decisions the agent must not make alone
approvals:
  final_assets_need_human: true
  never_self_approve: [logo_marks, claims, packaging_rules]

# Publishing and outbound messages are never automatic.
publish: { allowed: false }
