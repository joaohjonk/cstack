id: brand-hero-photo
outcome: a photographic or sculptural brand hero / poster key visual with the brand's own type composited on top
status: plan
target:
  description: a 2:1 hero people with taste read in two seconds as calm, deadpan and happy; Klein blue #002FA7 the one colour on warm white #F6F4EF; type ours, not the model's
  must:
  - photographic or sculptural quality, not clip art
  - no lettering from the model; wordmark and lines are FreeSans outlines composited after
  - every text run at least 41 px on a 1200 px artboard
  - large empty area reserved for type on a twelve-column grid
  must_not:
  - practitioner names, "in the style of", game or toy names, logos or reference photos in any prompt or input
  - a dog, or coloured dots in rows (the mood reference stays internal)
  quality_bar: ART DIRECTOR and BRAND DIRECTOR lenses both pass on the contact sheet; Joao picks the final
when:
- a brand needs a hero, poster or key visual and the identity already owns the type and colour
not_when:
- a logo or mark (logo-system); a rotating product (3d-web-hero)
candidates_considered:
- name: (a) photographic studio generation at draft tier across models, then finals for the two strongest, our outlined type composited in code
  verdict: chosen
  why: photo models are strongest at light, plaster, pigment and empty space; type stays exact and on-brand because it never passes through a model
- name: (b) sculptural / 3D-look generation (pigment cubes, plaster plinths) plus our type
  verdict: chosen
  why: run as territory B inside the same probe round; same pipeline and cost; it tests whether matter reads calmer than a studio scene
- name: real 3D scene (Blender) rendered and lit by hand, plus our type
  verdict: fallback
  why: total control of the cube and the grid, but hours of human time; use only if generation cannot hold the grid or the colour
- name: ask the image model to set the wordmark itself
  verdict: rejected
  why: lettering drifts, cannot be outlined or checked, and breaks R-TYPE-01
steps:
- id: brief
  does: territories A studio, B pigment, C poster photo from identity/briefs/2026-10-03-self-imagery.creative-brief.yaml
  kind: research
  skill: brief
  gate: {type: auto, check: "prompts carry no names, no style-of, no lettering; the runner rights check passes"}
  compare_to_target: each prompt names the colour, the ground, the empty area and the deadpan move
- id: probe
  does: 12 draft probes, four per territory, across FLUX.2 pro, Seedream 5.0 pro and gpt-image-2 on fal
  kind: probe
  skill: generate-media
  gate: {type: deterministic_check, check: cstack spend plan ok; every call in the ledger}
  compare_to_target: contact sheet labelled by territory and model
- id: judge
  does: creative-review lenses ART DIRECTOR and BRAND DIRECTOR on the contact sheet; pick two
  kind: human
  skill: creative-review
  gate: {type: independent_review, check: two picks with reasons; rejects named}
  compare_to_target: do the picks read calm, deadpan and happy, Klein blue on warm white, with room for type?
- id: finals
  does: two finals per pick at ~2400x1200 on the strongest model for that territory
  kind: probe
  skill: generate-media
  gate: {type: deterministic_check, check: cstack audit --aspect 2:1; spend under cap}
  compare_to_target: same as judge, at full size
- id: composite
  does: compose-imagery.py puts cstack. and the two lines on each final as FreeSans outlines
  kind: deterministic
  skill: vector-master
  gate: {type: deterministic_check, check: cstack svg legibility --min-px 41 --width 1200; JPG under 600 KB}
  compare_to_target: type sits on the grid in the reserved space and reads first
- id: pick
  does: Joao picks one composite before anything replaces docs/images/cstack-hero.svg or the README
  kind: human
  gate: {type: owner, check: Joao picks}
  compare_to_target: the pick is the hero
cost_ladder: probes about USD 1.02 (12 images); finals about USD 0.15-0.35 each; whole round under USD 3 against a USD 10 cap; stop at 12 probes, two rejected rounds, or the cap
failure_modes:
- model lettering or fake logos in the frame
- the blue drifts to cobalt or navy
- the grid bends or the cube melts at the edge
- busy frames with no room for type
evidence:
- {ref: "../../../R3/fal-flux2-prices-2026-10-03.md", kind: documented, date: 2026-10-03}
- {ref: "https://api.fal.ai/v1/models/pricing", kind: observed, date: 2026-10-03, note: "flux-2-pro 0.03 per processed MP; flux-2-max 0.07 per MP; seedream v5 pro 0.00017 per compute second; gpt-image-2.5 not on fal (404)"}
last_verified: 2026-10-03
stale_after_days: 90
related:
- skill:generate-media
- skill:creative-review
deliverable: {kind: image, key_visual: true}
territories:
- {name: A studio, probe_sheet: work/imagery/2026-10-03/sheet-A-studio.jpg, verdict: chosen}
- {name: B pigment, probe_sheet: work/imagery/2026-10-03/sheet-B-pigment.jpg, verdict: rejected}
- {name: C poster photo, probe_sheet: work/imagery/2026-10-03/sheet-C-poster.jpg, verdict: chosen}
gold_comparisons:
- {gold_ref: ref-nine-stop-line, sheet: work/imagery/2026-10-03/gold-side-by-side.jpg}
