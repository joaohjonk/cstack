<title id="t">Taste, made repeatable</title><desc id="d">Klein blue poster with grain. Top: TASTE, MADE in heavy white caps. Along the bottom the word repeatable is tossed letter by letter, each turned a little, as if dropped on the floor. The square full stop lands upright at the end.</desc>
