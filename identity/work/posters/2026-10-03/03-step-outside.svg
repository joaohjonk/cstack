<title id="t">Before use: step outside</title><desc id="d">Warm white poster. Top left, two lines in black: Before use: / step outside. Along the bottom runs a floor of twelve outlined square positions; the solid Klein blue square has left the row and is halfway out of the right edge of the poster.</desc>
