transferable_mechanism: >-
  Seven moves. A display word whose letters jump in size and weight on one baseline. A specification sheet
  (label and value columns in caps) used as the picture, data as content. A signal flag: a field of one colour
  with a single inset square of ground. Grain and blur as the texture of what is not yet decided, against the
  flat hard edge of what is. A block of fine vertical lines that reads as a gradient from a distance. Letters
  tossed along the bottom edge, once, as play. Digits stacked and overlapping as a specimen.
mechanism_tags: [jumping_letters, spec_sheet, signal_flag, grain_and_blur, line_gradient, tossed_type, digit_specimen, one_colour]
transfer: >-
  Carried into identity/work/figures/make-editorial.py as helpers (jumping, specsheet, grain, soft) on cstack's
  own grid, type and single colour. The wordmark never jumps; only headline words do. Blur marks positions a job
  did not take; a sharp square marks the ones it did. Tossed type appears once per set.
incidental_content: [mountain data, a product's name, a magazine's red, silver ink, aura gradients in violet, a crumpled paper texture]
do_not_copy:
