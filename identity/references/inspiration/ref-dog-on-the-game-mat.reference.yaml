# The mood reference that started cstack's self-imagery work. Third-party photograph: linked and credited, never stored or fed to a model.
id: ref-dog-on-the-game-mat
kind: image
library: inspiration
local_path: ""   # not stored; the owner holds a private copy, the repo has no right to host it
source_domain: fine-art photography (the photographer's own series of his dogs)
distance: far
rights:
  status: inspiration_only
  holder: the photographer (credited by name in docs/lineage.md)
  notes: credit and link only; no reproduction, no crop, no tracing, no use as a model input
credit: see docs/lineage.md, "William Wegman"
captured_at: "2026-10-03"
