transferable_mechanism: >-
  One living figure in a calm, empty studio, asked to hold an impossible position on a floor of marked
  positions, and holding it deadpan. Play as the face of seriousness; the floor of positions as the
  stand-in for choice.
mechanism_tags: [deadpan, empty_ground, field_of_positions, play_as_discipline, one_figure]
transfer: >-
  cstack keeps the floor of positions (the row of squares) and the deadpan; the figure becomes the blue square
  itself, which stands out of line, leaves the frame or grows larger than the poster.
incidental_content: [the animal, the game mat, its coloured dots, its lettering, the camera angle]
do_not_copy:
  - the animal or any animal drawn from life
  - the mat, its dots, its four colours or its name
  - the photograph as an image, in whole or in part
why_it_works: the owner's words, "playful, happy, something people with taste find tasteful"
axes:
