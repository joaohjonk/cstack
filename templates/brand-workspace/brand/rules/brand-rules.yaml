# Machine-testable brand rules (composition, hierarchy, imagery, generation).
# Tokens hold atomic values; this file holds RELATIONSHIPS. Every rule needs an id, a scope and a check:
#   deterministic -> enforced by code (cstack tokens lint, cstack audit, a script you add)
#   judge         -> evaluated by an independent reviewer that cites this rule id
# A rule that names a checker nobody wrote is a bug: mark it `check: judge` until the checker exists.
version: 0.1
rules: []
