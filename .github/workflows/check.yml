# cstack CI: T0 static checks + T1 tests on Node 20 and 22. No secrets, no paid calls.
# CI installs ffmpeg and the Chromium that matches playwright-core, then fails if any test skipped:
# locally those tests skip with a reason when the tools are absent; in CI a skip would hide a regression.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # evals plan diffs against the PR base

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for playwright-core
        run: npx --no-install playwright-core install chromium

      - name: Check (validate + budgets + tests), no skipped tests
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
          grep -q '^# skipped 0$' check.log || { echo "::error::tests were skipped in CI"; grep -B2 '# SKIP' check.log; exit 1; }

      - name: Setup script smoke test (dry run)
        run: CSTACK_SETUP_DRY_RUN=1 ./setup

      - name: Eval plan for this PR (informational)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          plan="$(node bin/cstack.mjs evals plan --since "origin/${{ github.base_ref || 'main' }}" || true)"
          printf '%s\n' "$plan"
          { echo '### cstack evals plan'; echo '```'; printf '%s\n' "$plan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
